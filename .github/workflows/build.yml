# Build the ROMs and run the PyBoy tests on every push and pull request.
# Uses the same GBDK version as local development (docs/DECISIONS.md).
name: Build and test

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache GBDK 4.5.0
        id: gbdk
        uses: actions/cache@v4
        with:
          path: gbdk
          key: gbdk-4.5.0-linux64

      - name: Download GBDK 4.5.0
        if: steps.gbdk.outputs.cache-hit != 'true'
        run: curl -fsSL https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz | tar -xz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install test tools
        run: pip install -r tools/requirements.txt

      # romusage -R in the Makefile fails the build if a ROM bank overflows.
      - name: Build
        run: make all savetest

      - name: Test (DMG and GBC mode)
        run: make test

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/out/

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: roms
          path: |
            obj/ApexLab.gb
            obj/savetest.gb
