[pytest]
testpaths = tests
# A test marked "xfail" for a known bug must start failing the run once the bug is
# fixed, so the marker gets removed together with the fix.
xfail_strict = true
# pysdl2 announces which SDL2 build it found; the tests run without a window anyway.
filterwarnings =
    ignore:Using SDL2 binaries:UserWarning
markers =
    level(index): start the game fixture in this level (LEVEL_* in tests/gamelib.py)
    both_modes: run in DMG and GBC mode even in the quick tier (the mode changes the result)
    full: only in the full tier (make test-full): extra start times and seeds
    mode(name): run only in this mode ("dmg" or "cgb"), in both tiers
